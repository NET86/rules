# Mihomo 日常规则示例：加入已有配置，不包含代理节点。
proxy-groups:
  - name: AI
    type: select
    include-all: true
    proxies: [REJECT]

rule-providers:
  net86-ai-daily:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/NET86/rules/stable/rules/mihomo/ai-daily.yaml
    path: ./rule-providers/net86-ai-daily.yaml
    interval: 3600

rules:
  - RULE-SET,net86-ai-daily,AI,no-resolve
  # 在 AI 策略组添加并选择可用节点，替换 REJECT 占位；其余规则和 MATCH 放在下方。
