RULE-SET,https://raw.githubusercontent.com/NET86/rules/stable/rules/surge/openai.list,OpenAI,update-interval=3600
RULE-SET,https://raw.githubusercontent.com/NET86/rules/stable/rules/surge/ai-core.list,AI,update-interval=3600
RULE-SET,https://raw.githubusercontent.com/NET86/rules/stable/rules/surge/openai-voice-ip.list,OpenAI,no-resolve,update-interval=3600

