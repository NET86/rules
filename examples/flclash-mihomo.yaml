# 加入已有 FlClash/Mihomo 配置，不包含代理节点。
# 导入后在 AI 策略组添加并选择可用节点；REJECT 仅为占位。
proxy-groups:
  - name: AI
    type: select
    include-all: true
    proxies: [REJECT]
  - name: OpenAI
    type: select
    proxies: [AI]

rule-providers:
  net86-openai:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/NET86/rules/stable/rules/mihomo/openai.yaml
    path: ./rule-providers/net86-openai.yaml
    interval: 3600
  net86-ai-core:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/NET86/rules/stable/rules/mihomo/ai-core.yaml
    path: ./rule-providers/net86-ai-core.yaml
    interval: 3600
  net86-openai-voice:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/NET86/rules/stable/rules/mihomo/openai-voice-ip.yaml
    path: ./rule-providers/net86-openai-voice.yaml
    interval: 3600

rules:
  # 放在宽泛的 Google、Microsoft、GitHub 和最终匹配规则之前。
  - RULE-SET,net86-openai,OpenAI
  - RULE-SET,net86-ai-core,AI
  - RULE-SET,net86-openai-voice,OpenAI,no-resolve
  # 其余规则和 MATCH 放在下方。
