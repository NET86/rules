name: 规则同步
on:
  schedule:
    - cron: '31 4,10,16,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: publish-reviewed-rules
  cancel-in-progress: false
jobs:
  schedule-gate:
    if: github.repository == 'NET86/rules'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      run_sync: ${{ github.event_name != 'schedule' || steps.backup.outputs.run_sync == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'schedule'
        with:
          ref: main
          persist-credentials: false
      - name: 检查是否需要兜底同步
        id: backup
        if: github.event_name == 'schedule'
        run: python scripts/schedule_gate.py
        env:
          GH_TOKEN: ${{ github.token }}
  sync:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.12'
      - run: python scripts/check_git_identity.py
      - name: 验证或恢复稳定版本
        run: python scripts/release.py --recover-only
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 安装锁定的官方文档 HTTPS 依赖
        continue-on-error: true
        run: 'python -m pip install --only-binary=:all: --require-hashes -r requirements-intake.txt'
      - run: python scripts/download_mihomo.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: sources/engines.json
      - run: python scripts/build_flclash_core.py
      - name: 更新规则来源并检查官方资料
        run: python scripts/sync.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/rules.py --check
      - run: python scripts/verify_rules.py
      - name: 双内核验证、发布、回读与失败恢复
        run: python scripts/release.py --flclash-core .work/bin/flclash-core
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sync-validation
          path: |
            .work/*report.json
            .work/sync-error.txt
            .work/*validation*.json
            .work/mihomo-*.log
          include-hidden-files: true
          retention-days: 14
      - name: 上传报告后更新异常 Issue
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        run: python scripts/notify_review.py sync .work/sync-report.json ${{ job.status == 'failure' && '--failed' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 汇总本次执行结果
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        run: python scripts/release.py --summary-only sync --job-status ${{ job.status }}
