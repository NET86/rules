name: 依赖自动升级
on:
  workflow_run:
    workflows: [规则校验]
    types: [completed]
permissions:
  contents: write
  pull-requests: read
  actions: read
concurrency:
  group: dependency-automerge
  cancel-in-progress: false
jobs:
  merge:
    if: >-
      github.repository == 'NET86/rules' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Privileged workflow: execute only trusted main code, never PR code/artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: main
          # Git pushes only an existing tested commit; never check out PR code.
          fetch-depth: 0
      - run: python scripts/merge_dependencies.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 汇总本次执行结果
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python scripts/release.py --summary-only dependencies --job-status ${{ job.status }}
