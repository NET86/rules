name: OpenAI source probe
on:
  workflow_dispatch:
  push:
    branches: [diag/openai-sources-20261108]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r requirements-intake.txt'
        continue-on-error: true
      - name: Check official URLs and content
        shell: bash
        run: |
          mkdir -p .work/openai-probe
          cd .work/openai-probe
          fetch() {
            key=$1
            shift
            printf '%s ' "$key"
            curl --silent --show-error --location --max-time 20 --proto '=https' --proto-redir '=https' --output "$key.body" --dump-header "$key.headers" --write-out '%{http_code} %{content_type} %{url_effective} %{size_download}\n' "$@" || true
            awk 'tolower($0) ~ /^(cf-mitigated|last-modified|etag):/' "$key.headers"
          }
          short=https://help.openai.com/en/articles/9247338
          slug=network-recommendations-for-chatgpt-errors-on-web-and-apps
          fetch voice https://openai.com/chatgpt-voice.json
          fetch short "$short"
          fetch canonical "$short-$slug"
          fetch markdown -H 'Accept: text/markdown' "$short-$slug"
          fetch help-lb "https://help-lb.openai.com/en/articles/9247338-$slug"
          cd ../..
          PYTHONPATH=scripts python - <<'PY'
          import hashlib, ipaddress, json
          from pathlib import Path
          from intake import extract_document, fetch_official
          from rules import voice_rules
          from sync import fetch

          root = Path('.work/openai-probe')
          source = next(row for row in json.loads(Path('sources/official.json').read_text())['sources']
                        if row['id'] == 'openai-network')
          voice = (root / 'voice.body').read_bytes()
          data = json.loads(voice)
          rules = voice_rules(data)
          masks = sorted({(net.version, net.prefixlen) for row in rules
                          for net in [ipaddress.ip_network(row.value)]})
          print('voice', hashlib.sha256(voice).hexdigest(), data.get('creationTime'), len(rules), masks)
          for key in ('short', 'canonical', 'markdown', 'help-lb'):
              try:
                  facts = extract_document(source, (root / (key + '.body')).read_bytes())
                  print(key, 'valid facts', len(facts['rules']), facts['document_sha256'])
              except (OSError, ValueError, KeyError) as error:
                  print(key, type(error).__name__, str(error))
          diagnostics = []
          try:
              body, transport = fetch_official(source, fetch, diagnostics=diagnostics)
              facts = extract_document(source, body)
              print('production fetch', transport, len(facts['rules']), facts['document_sha256'])
          except (OSError, ValueError, KeyError) as error:
              print('production fetch', type(error).__name__, str(error))
          print('production fetch diagnostics', json.dumps(diagnostics))
          PY
